[package]
name = "cli"
description = "Command-line interface for gslib_rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "gslib-rs"
path = "src/main.rs"
# Same rustdoc output name as the `gslib_rs` library; the binary has no API.
doc = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
gslib_rs = { path = "../gslib_rs", version = "0.1.0", features = ["plot", "parallel"] }
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_chacha = "0.10"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
