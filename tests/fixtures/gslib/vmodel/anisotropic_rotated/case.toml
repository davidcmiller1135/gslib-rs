schema = 1
program = "vmodel"
description = "Two nested anisotropic structures with non-zero azimuth, dip and plunge (including a negative dip), sampled in oblique directions."

[parameters]
nlag = 20
nugget = 0.1
directions = [
    { azimuth = 30.0, dip = -20.0, lag = 1.0 },
    { azimuth = 120.0, dip = 0.0, lag = 1.0 },
    { azimuth = 75.0, dip = 45.0, lag = 0.75 },
]
structures = [
    { kind = 1, cc = 0.6, angles = [30.0, -20.0, 10.0], ranges = [20.0, 8.0, 4.0] },
    { kind = 2, cc = 0.3, angles = [120.0, 0.0, 0.0], ranges = [15.0, 10.0, 5.0] },
]

[[tolerances]]
quantity = "gamma"
relative = 1e-9
justification = "setrot converts degrees with pi = 3.141592654 (F-004), rotating the frame by ~2e-10 rad; off-axis this changes squared distances by ~2e-10 * (anisotropy^2 - 1), i.e. ~1e-9 for these ranges."

[[tolerances]]
quantity = "cov"
relative = 1e-9
justification = "Same as gamma: cov = sill - gamma."

[[tolerances]]
quantity = "ro"
relative = 1e-9
justification = "Same as gamma: ro = cov / sill."
