schema = 1
program = "sgsim"
description = "As unconditional, with a 2-level multiple-grid path on a 24 x 20 grid (level 1: every 4th node, level 2: every 8th) and an even seed: checks the multiple-grid offsets of the random path (RN5) and that even ACORN seeds work as in GSLIB (D-039)."

[parameters]
grid_counts = [24, 20, 1]
grid_origin = [0.5, 0.5, 0.5]
grid_spacing = [1.0, 1.0, 1.0]
realizations = 2
seed = 1234
search_radius = 0.5
multiple_grid = 2
