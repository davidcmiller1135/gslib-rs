schema = 1
program = "kt3d"
description = "Ordinary kriging with a Gaussian model and no nugget (range 80 over data about 10 apart): badly conditioned systems, where the k cond(A) eps bound (D-010) is what keeps the comparison honest."
inputs = ["smooth.dat"]

[parameters]
data = "smooth.dat"
coordinate_columns = [1, 2, 0]
variable_column = 4
grid_counts = [8, 8, 1]
grid_origin = [5.0, 5.0, 0.0]
grid_spacing = [12.0, 12.0, 1.0]
min_data = 4
max_data = 12
search_radii = [40.0, 40.0, 40.0]
kriging = "ordinary"
nugget = 0.0
structures = [{ kind = 3, cc = 1.0, angles = [0.0, 0.0, 0.0], ranges = [80.0, 80.0, 80.0] }]
