schema = 1
program = "kt3d"
description = "Ordinary point kriging of 60 scattered 2-D points on an 8 x 8 grid, isotropic search (radius 40, 4 to 12 data) and spherical model: the baseline for search sets, order, weights, estimates and variances."
inputs = ["smooth.dat"]

[parameters]
data = "smooth.dat"
coordinate_columns = [1, 2, 0]
variable_column = 4
grid_counts = [8, 8, 1]
grid_origin = [5.0, 5.0, 0.0]
grid_spacing = [12.0, 12.0, 1.0]
min_data = 4
max_data = 12
search_radii = [40.0, 40.0, 40.0]
kriging = "ordinary"
nugget = 0.1
structures = [{ kind = 1, cc = 0.9, angles = [0.0, 0.0, 0.0], ranges = [50.0, 50.0, 50.0] }]
