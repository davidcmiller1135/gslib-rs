schema = 1
program = "kt3d"
description = "Simple kriging with a short search (radius 12, 1 to 4 data), so some nodes find exactly one datum, where kt3d skips kriging and returns that datum (F-014)."
inputs = ["smooth.dat"]

[parameters]
data = "smooth.dat"
coordinate_columns = [1, 2, 0]
variable_column = 4
grid_counts = [8, 8, 1]
grid_origin = [5.0, 5.0, 0.0]
grid_spacing = [12.0, 12.0, 1.0]
min_data = 1
max_data = 4
search_radii = [12.0, 12.0, 12.0]
kriging = "simple"
sk_mean = 2.8
nugget = 0.1
structures = [{ kind = 1, cc = 0.9, angles = [0.0, 0.0, 0.0], ranges = [50.0, 50.0, 50.0] }]

[[expected_deviations]]
quantity = "sk_single_datum"
divergence = "Simple kriging with one datum (kt3d) (ROADMAP §2)"
reason = "With one datum kt3d returns the datum's value and the OK variance 2(C(0) - C(h)) whatever the kriging type (KT3D.FOR lines 727-758); simple kriging gives skmean + (C(h)/C(0))(v - skmean). The harness checks GSLIB's values against that relation exactly instead."
