[package]
name = "xtask"
description = "Developer tasks for gslib-rs, including the GSLIB reference recipe"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
oracle-case = { path = "../oracle-case", version = "0.1.0" }
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_chacha = "0.10"
rand_distr = { version = "0.6", default-features = false, features = ["std"] }
toml = "1.2"

[dev-dependencies]
gslib_rs = { path = "../gslib_rs", version = "0.1.0", default-features = false }
tempfile = "3.27"
