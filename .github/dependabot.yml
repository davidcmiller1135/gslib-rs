# Weekly crate-update PRs, grouped into one PR. There is no CI (D-053): run
# the checks in AGENTS.md locally (pinned toolchain, strict lints, cargo deny)
# before merging.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
