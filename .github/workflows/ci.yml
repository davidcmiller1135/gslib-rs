name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain comes from rust-toolchain.toml.
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # plotters' font stack links system fontconfig via pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - name: Clippy without the plot feature
        run: cargo clippy -p gslib_rs --all-targets --no-default-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # plotters' font stack links system fontconfig via pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Vendored GSLIB 2.0 matches its manifest
        run: cargo xtask oracle verify-source
      - name: Synthetic data suites match their generator
        run: cargo xtask gen-data --check
      - name: Test without the plot feature
        run: cargo test -p gslib_rs --no-default-features

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # plotters' font stack links system fontconfig via pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  oracle:
    # Builds the Fortran GSLIB 2.0 reference (docs/spec/harness.md, R1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask oracle build

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # plotters' font stack links system fontconfig via pkg-config.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      # Keep in sync with `rust-version` in Cargo.toml. `+1.89` overrides
      # rust-toolchain.toml.
      - run: rustup toolchain install 1.89 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.89 test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
