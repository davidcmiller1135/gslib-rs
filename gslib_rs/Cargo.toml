[package]
name = "gslib_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
ndarray = "0.15"        # for multi-dimensional arrays
rand = "0.8"            # random number generation
nalgebra = "0.32"       # linear algebra
plotters = { version = "0.3", optional = true }

# Optional features
[features]
plot = ["plotters"]
