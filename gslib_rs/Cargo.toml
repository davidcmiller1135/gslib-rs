[package]
name = "gslib_rs"
description = "Geostatistics in Rust: a port of GSLIB (variograms, kriging, simulation)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
nalgebra = "0.35"
plotters = { version = "0.3.7", optional = true }
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_distr = { version = "0.6", default-features = false, features = ["std"] }
libm = "0.2"
statrs = "0.19"
thiserror = "2"

[features]
default = ["plot"]
## PNG/SVG plotting via plotters (pulls in font rendering, incl. fontconfig).
plot = ["dep:plotters"]

[dev-dependencies]
approx = "0.5"
proptest = "1.12"
rand_chacha = "0.10"
tempfile = "3.27"
